<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberGuard - Simulador de Segurança</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      color: #c9d1d9;
      line-height: 1.6;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }
    header {
      background: rgba(22, 27, 34, 0.9);
      backdrop-filter: blur(10px);
      padding: 1rem 0;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #30363d;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: #58a6ff;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
    }
    .nav-links a {
      color: #c9d1d9;
      text-decoration: none;
      transition: color 0.3s;
    }
    .nav-links a:hover {
      color: #58a6ff;
    }
    main {
      flex: 1 0 auto;
      padding: 7rem 2rem 2rem 2rem;
      max-width: 800px;
      margin: auto;
    }
    .button {
      background-color: #238636;
      border: none;
      color: white;
      padding: 0.75rem 1.5rem;
      margin: 1rem 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 5px;
      transition: background 0.3s;
    }
    .button:hover {
      background-color: #2ea043;
    }
    .question {
      margin-top: 2rem;
    }
    .hidden {
      display: none;
    }
    .feedback {
      font-weight: bold;
      margin-top: 1rem;
    }
    footer {
      flex-shrink: 0;
      background: #0d1117;
      padding: 2rem 0;
      text-align: center;
      border-top: 1px solid #30363d;
      margin-top: 4rem;
    }
    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .social-links {
      display: flex;
      gap: 1rem;
    }
    .social-links a {
      color: #6e7681;
      font-size: 1.5rem;
      transition: color 0.3s;
    }
    .social-links a:hover {
      color: #58a6ff;
    }
    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
      .footer-content {
        flex-direction: column;
        text-align: center;
      }
      main {
        padding: 7rem 1rem 2rem 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="container">
      <div class="logo">🛡️ CyberGuard</div>
      <ul class="nav-links">
        <li><a href="index.html">Início</a></li>
        <li><a href="features.html">Recursos</a></li>
        <li><a href="README.md">Sobre</a></li>
        <li><a href="https://github.com/NeonBrasil">Contato</a></li>
      </ul>
    </nav>
  </header>
  <main id="app">
    <section id="menu">
      <h2>Escolha o nível das perguntas:</h2>
      <button class="button" onclick="startSimulation('small')">Fácil</button>
      <button class="button" onclick="startSimulation('medium')">Médio</button>
      <button class="button" onclick="startSimulation('large')">Difícil</button>
    </section>
    <section id="quiz" class="hidden">
      <div id="question-container" class="question"></div>
      <div id="options-container"></div>
      <button class="button" onclick="nextQuestion()">Próxima</button>
    </section>
    <section id="result" class="hidden">
      <h2>Resultado Final</h2>
      <p id="score"></p>
      <p id="feedback" class="feedback"></p>
      <button class="button" onclick="location.reload()">Jogar Novamente</button>
    </section>
  </main>
  <footer>
    <div class="container">
      <div class="footer-content">
        <div>
          <p>&copy; 2025 Cayque Cicarelli. Todos os direitos reservados.</p>
        </div>
        <div class="social-links">
          <a href="https://www.linkedin.com/in/cayque-cicarelli/" title="LinkedIn">🔗</a>
          <a href="https://github.com/NeonBrasil" title="GitHub">💻</a>
          <a href="" title="Email">📧</a>
        </div>
      </div>
    </div>
  </footer>
  <script>
    const quizzes = {
      small: [
        {
          question: "Seu Wi-Fi de empresa está aberto e sem senha. O que você faz?",
          options: ["Nada, está tudo bem.", "Coloca uma senha forte e WPA2."],
          answer: 1
        },
        {
          question: "Você vê um colaborador acessando o e-mail pessoal no computador de serviço. O que você faz?",
          options: ["Aviso ele que o que está fazendo não é permitido.", "Ignoro e faço igual."],
          answer: 0
        },
        {
          question: "Você recebe um e-mail suspeito com um link estranho. O que faz?",
          options: ["Clica no link para ver o que é.", "Reporta à equipe de segurança."],
          answer: 1
        },
        {
          question: "Você encontra um pen drive na mesa de um colega. O que faz?",
          options: ["Leva para casa para ver o que tem.", "Deixar ele."],
          answer: 1
        },
        {
          question: "Você vê uma planilha de clientes sendo enviada por e-mail pessoal. E agora?",
          options: ["Ignora, não é seu problema.", "Reporta à equipe de segurança."],
          answer: 1
        }
      ],
      medium: [
        {
          question: "Recebeu um e-mail dizendo que precisa atualizar sua senha clicando em um link. O que fazer?",
          options: ["Clicar logo no link.", "Verificar remetente e contato oficial da TI."],
          answer: 1
        },
        {
          question: "Você está em uma reunião e alguém pede para compartilhar sua tela. O que faz?",
          options: ["Compartilha sem pensar.", "Confirma o que será mostrado."],
          answer: 1
        },
        {
          question: "Você recebeu um e-mail da Mincrosoft avisando que sua conta foi comprometida. O que você faz?",
          options: ["Denúncia como Pishing.", "Entro em desespero e sigo o passo a passo do e-mail."],
          answer: 0
        },
        {
          question: "Um colega de RH pede seu login para um teste. E agora?",
          options: ["Fornece na hora.", "Recusa e orienta a usar o sistema oficial."],
          answer: 1
        }
      ],
      large: [
        {
          question: "Você conecta um pendrive desconhecido encontrado na recepção. E agora?",
          options: ["Ver o que tem dentro.", "Entregar à equipe de segurança."],
          answer: 1
        },
        {
          question: "Qual das seguintes é um Framework de segurança aceito mundialmente?",
          options: ["ISO 27001.", "NOST Cybersecurity Framework"],
          answer: 0
        },
        {
          question: "O sistema pede autenticação por token, mas você quer agilizar. O que faz?",
          options: ["Pede para desativar.", "Entende a importância da autenticação."],
          answer: 1
        }
      ]
    };

    let currentQuiz = [];
    let currentIndex = 0;
    let score = 0;

    function startSimulation(size) {
      currentQuiz = quizzes[size];
      currentIndex = 0;
      score = 0;
      document.getElementById('menu').classList.add('hidden');
      document.getElementById('quiz').classList.remove('hidden');
      showQuestion();
    }

    function showQuestion() {
      const q = currentQuiz[currentIndex];
      document.getElementById('question-container').innerText = q.question;
      const options = document.getElementById('options-container');
      options.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'button';
        btn.innerText = opt;
        btn.onclick = () => {
          if (i === q.answer) score++;
          document.querySelectorAll('#options-container .button').forEach(b => b.disabled = true);
        };
        options.appendChild(btn);
      });
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuiz.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('result').classList.remove('hidden');
      document.getElementById('score').innerText = `Você acertou ${score} de ${currentQuiz.length} perguntas.`;
      let feedback = '';
      const ratio = score / currentQuiz.length;
      if (ratio < 0.5) feedback = 'Você precisa melhorar sua postura em segurança!';
      else if (ratio < 2) feedback = 'Você está no caminho certo!';
      else feedback = 'Excelente! Você é um agente da segurança!';
      document.getElementById('feedback').innerText = feedback;
    }
  </script>
</body>
</html>
